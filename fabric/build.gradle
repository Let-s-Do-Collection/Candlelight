plugins {
    id "com.github.johnrengelman.shadow" version "8.0.0"
    id "com.modrinth.minotaur" version "2.+"
    id "net.darkhax.curseforgegradle" version "1.1.25"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

def jarFileName = 'letsdo-candlelight-fabric'
def changelogText = rootProject.file("CHANGELOG.md").text
archivesBaseName = jarFileName


loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

repositories {
    maven {
        url "https://maven.terraformersmc.com"
    }
    maven {
        url = 'https://maven.ladysnake.org/releases'
    }
}


dependencies {
    include(modImplementation("net.satisfy.foundation:foundation-fabric:${rootProject.foundation_version}") { transitive = false })
    modApi("net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}") { exclude group: 'net.fabricmc', module: 'fabric-loader' }
    modApi("dev.architectury:architectury-fabric:${rootProject.architectury_version}") { exclude group: 'net.fabricmc', module: 'fabric-loader' }
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modImplementation("me.shedaniel:RoughlyEnoughItems-fabric:$rei_version") { exclude group: 'net.fabricmc', module: 'fabric-loader' }
    modImplementation("dev.emi:trinkets:${rootProject.trinkets_version}")
    modCompileOnly("io.wispforest:accessories-fabric:${rootProject.accessories_version}") { transitive = false }
    modApi("me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_fabric_version}") { exclude group: "net.fabricmc.fabric-api" }
    modImplementation("com.terraformersmc:modmenu:${rootProject.modmenu_version}") { exclude group: 'net.fabricmc', module: 'fabric-loader' }
    modImplementation(files(rootProject.file("local-mods/letsdo-farm_and_charm-fabric-${rootProject.farm_and_charm_version}.jar")))

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

shadowJar {
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set("dev-shadow")
}

remapJar {
    injectAccessWidener = true
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier.set(null)
}

jar {
    archiveClassifier.set("dev")
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenFabric(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }

    repositories {
    }
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "lets-do-candlelight-farmcharm-compat"
    versionNumber = rootProject.mod_version
    versionName = "${rootProject.archives_base_name}-${rootProject.mod_version} [${rootProject.minecraft_version}-fabric]"
    versionType = "release"
    changelog = rootProject.file("CHANGELOG.md").exists() ? rootProject.file("CHANGELOG.md").text : " "
    gameVersions = [rootProject.minecraft_version]
    loaders = ["fabric"]
    uploadFile = remapJar
    additionalFiles = [tasks.sourcesJar.archiveFile]

    dependencies {
        required.project "architectury-api"
        required.project "lets-do-farm-charm"
        required.project "cloth-config"
    }
}

tasks.register("curseforge1038117", net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    apiToken = System.getenv("CURSEFORGE_API_KEY")
    disableVersionDetection()

    def mainFile = upload("1038117", remapJar)
    mainFile.releaseType = "release"
    mainFile.changelog = changelogText
    mainFile.changelogType = "markdown"
    mainFile.displayName = "Candlelight - ${rootProject.mod_version} - FABRIC - ${rootProject.minecraft_version}"
    mainFile.addGameVersion(rootProject.minecraft_version)
    mainFile.addModLoader("Fabric")
    mainFile.addEnvironment("Client", "Server")
    mainFile.addRequirement("architectury-api")
    mainFile.addRequirement("lets-do-farm-charm")
    mainFile.addRequirement("cloth-config")
}


tasks.register("releaseChangelog") {
    group = "publishing"
    description = "Send the latest changelog block to Discord"

    doLast {
        def discordWebhookUrl = (project.findProperty("webhook") ?: System.getenv("DISCORD_WEBHOOK_URL"))?.toString()?.trim()
        if (!discordWebhookUrl) {
            println "No Discord webhook set. Provide -Pwebhook=... or set DISCORD_WEBHOOK_URL"
            return
        }
        println "Using Discord webhook: ${discordWebhookUrl.replaceAll('/api/webhooks/[^/]+/[^/]+$', '/api/webhooks/********/********')}"

        def modName = (project.findProperty("modDisplayName") ?: "Candlelight").toString()
        def versionLabel = rootProject.mod_version
        def full = rootProject.file("CHANGELOG.md").exists() ? rootProject.file("CHANGELOG.md").text : ""
        def m = (full =~ /(?ms)^(\[[^\]\n]+\][ \t]*$.*?)(?:^\*\*\*[ \t]*$|\z)/)
        def block = m.find() ? m.group(1).trim() : full.trim()

        int embedLimit = 4000
        int messageLimit = 5500
        def chunks = []
        def current = new StringBuilder()
        block.readLines().each { line ->
            if (current.length() + line.length() + 1 > embedLimit) {
                chunks << current.toString().trim()
                current = new StringBuilder()
            }
            current.append(line).append("\n")
        }
        if (current.toString().trim()) chunks << current.toString().trim()

        def links = "[Modrinth](https://modrinth.com/mod/lets-do-candlelight-farmcharm-compat)\n[CurseForge](https://www.curseforge.com/minecraft/mc-mods/lets-do-candlelight-farm-charm-compat)"
        def messages = [[]]
        int messageSize = 0
        chunks.eachWithIndex { chunk, index ->
            if (messages.last().size() == 10 || messageSize + chunk.length() > messageLimit) {
                messages << []
                messageSize = 0
            }
            def embed = [description: chunk]
            if (index == 0) embed.title = "**Changelog**"
            if (index == chunks.size() - 1) embed.fields = [[name: "**Download it on**", value: links, inline: false]]
            messages.last() << embed
            messageSize += chunk.length()
        }

        boolean dryRun = (project.findProperty("dryRun") ?: "false").toString().toBoolean()
        messages.eachWithIndex { embeds, index ->
            def payload = [
                    username  : "[Let’s Do] Assistant",
                    avatar_url: "https://raw.githubusercontent.com/Let-s-Do-Collection/Candlelight/1.21.1/common/src/main/resources/pack.png",
                    embeds    : embeds
            ]
            if (index == 0) payload.content = "**${modName} ${versionLabel} has been released! 🎉**\n\nLearn about all changes and improvements below:".toString()
            def json = groovy.json.JsonOutput.toJson(payload)
            if (dryRun) {
                println "DRY RUN — message ${index + 1}/${messages.size()}:\n${groovy.json.JsonOutput.prettyPrint(json)}"
                return
            }
            HttpURLConnection conn = (HttpURLConnection) new URL(discordWebhookUrl).openConnection()
            try {
                conn.setRequestMethod("POST")
                conn.setDoOutput(true)
                byte[] body = json.getBytes("UTF-8")
                conn.setRequestProperty("Content-Type", "application/json")
                conn.setRequestProperty("Content-Length", Integer.toString(body.length))
                conn.getOutputStream().write(body)
                int code = conn.getResponseCode()
                println "Discord message ${index + 1}/${messages.size()}: ${code} ${conn.getResponseMessage()}"
                if (code >= 300) {
                    def error = conn.getErrorStream()
                    if (error != null) println error.getText("UTF-8")
                }
            } finally {
                conn.disconnect()
            }
            if (index < messages.size() - 1) Thread.sleep(1000)
        }
    }
}

tasks.named("modrinth").configure {
    finalizedBy(tasks.named("releaseChangelog"))
}



