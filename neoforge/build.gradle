plugins {
    id "com.github.johnrengelman.shadow" version "8.0.0"
    id "com.modrinth.minotaur" version "2.+"
    id "net.darkhax.curseforgegradle" version "1.1.25"
}


architectury {
    platformSetupLoomIde()
    neoForge()
}

def jarFileName = 'letsdo-candlelight-neoforge'
def changelogText = rootProject.file("CHANGELOG.md").text
archivesBaseName = jarFileName


loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    neoForge {
    }
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

dependencies {
    include(modImplementation("net.satisfy.foundation:foundation-neoforge:${rootProject.foundation_version}") { transitive = false })
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"
    modApi "dev.architectury:architectury-neoforge:${rootProject.architectury_version}"
    modImplementation("top.theillusivec4.curios:curios-neoforge:${rootProject.curios_version}")
    modCompileOnly("io.wispforest:accessories-neoforge:${rootProject.accessories_version}") { transitive = false }
    modImplementation(files(rootProject.file("local-mods/letsdo-farm_and_charm-neoforge-${rootProject.farm_and_charm_version}.jar")))
    modImplementation "me.shedaniel:RoughlyEnoughItems-neoforge:$rei_version"
    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive false }
}


processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set("dev-shadow")
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier.set(null)
    atAccessWideners.add(loom.accessWidenerPath.get().asFile.getName())
}

jar {
    archiveClassifier.set("dev")
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenForge(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }

    repositories {
    }
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "lets-do-candlelight-farmcharm-compat"
    versionNumber = rootProject.mod_version
    versionName = "${rootProject.archives_base_name}-${rootProject.mod_version} [${rootProject.minecraft_version}-neoforge]"
    versionType = "release"
    changelog = rootProject.file("CHANGELOG.md").exists() ? rootProject.file("CHANGELOG.md").text : " "
    gameVersions = [rootProject.minecraft_version]
    loaders = ["neoforge"]
    uploadFile = remapJar
    additionalFiles = [tasks.sourcesJar.archiveFile]

    dependencies {
        required.project "architectury-api"
        required.project "lets-do-farm-charm"
    }
}

tasks.register("curseforge1038117", net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    apiToken = System.getenv("CURSEFORGE_API_KEY")
    disableVersionDetection()

    def mainFile = upload("1038117", remapJar)
    mainFile.releaseType = "release"
    mainFile.changelog = changelogText
    mainFile.changelogType = "markdown"
    mainFile.displayName = "Candlelight - ${rootProject.mod_version} - NEOFORGE - ${rootProject.minecraft_version}"
    mainFile.addGameVersion(rootProject.minecraft_version)
    mainFile.addModLoader("NeoForge")
    mainFile.addEnvironment("Client", "Server")
    mainFile.addRequirement("architectury-api")
    mainFile.addRequirement("lets-do-farm-charm")
}
